[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-wrangler"
version = "0.1.0"
description = "Document intelligence you can run on a laptop. Hybrid retrieval over PDFs with mandatory provenance."
requires-python = ">=3.12"
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
embed = [
    "sqlite-vec>=0.1.6",
]
dev = [
    "pytest>=8",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
cw = "context_wrangler.cli:main"

[tool.setuptools.packages.find]
include = ["context_wrangler*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
